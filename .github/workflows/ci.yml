name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - run: go vet ./...
      - run: go test -race ./...
      # Perf bars (PLAN §1) run without the race detector — its 2-10×
      # slowdown would measure the instrumentation, not the product.
      - name: performance bars
        run: go test ./internal/perf/ -v -count=1
      - run: go build ./...

  # Windows is build-only until beta (see PLAN.md risk #3): keep it compiling,
  # full support lands with the beta hardening pass.
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
